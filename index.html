<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Emprendimiento</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5bea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emprendimiento">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--tx:#1b2438;--mut:#6b7590;--pri:#2f5bea;--priTx:#ffffff;--ok:#12a36b;--bad:#e5484d;--bd:#e3e8f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#192137;--tx:#eef1fa;--mut:#9aa5c4;--pri:#6b8cff;--priTx:#0f1524;--ok:#37c892;--bad:#ff7075;--bd:#28324d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#192137;--tx:#eef1fa;--mut:#9aa5c4;--pri:#6b8cff;--priTx:#0f1524;--ok:#37c892;--bad:#ff7075;--bd:#28324d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 96px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:22px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px}
.hero{background:var(--pri);color:var(--priTx);border:0}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.lbl{font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.big{font-size:26px;font-weight:700;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.act{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:14px 10px;font-size:15px;font-weight:600;text-align:center}
.act span{display:block;font-size:24px;margin-bottom:4px}
.act:active,.btn:active{transform:scale(.97)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.end{display:flex;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.sm{background:var(--pri);color:var(--priTx);border:0;border-radius:10px;padding:6px 11px;font-size:14px;font-weight:600}
.x{background:none;border:0;font-size:16px;padding:4px;opacity:.75}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 12px}
label{font-size:13px;color:var(--mut)}
.btn{width:100%;padding:14px;border-radius:14px;border:0;background:var(--pri);color:var(--priTx);font-size:16px;font-weight:700;margin-bottom:8px}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.line{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
.b2{height:7px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:4px}
.b2 i{display:block;height:100%;background:var(--pri)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.pc img,.pc .ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px}
.pc .t{padding:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:700}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.show{display:flex}
#sh{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
#sh h2{margin:0 0 14px;font-size:19px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:20px 0;font-size:14px}
</style>
</head>
<body>
<div id="app"><p style="padding:24px;font-family:system-ui,sans-serif;color:#6b7590">Cargando la app…</p></div>
<div id="ov"><div id="sh"></div></div>
<div id="toast"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a)a.innerHTML='<div style="padding:20px;font-family:system-ui,sans-serif"><h2>⚠️ Ocurrió un error</h2><p style="word-break:break-word">'+String(e.message).replace(/</g,"&lt;")+" (línea "+e.lineno+')</p><p>Tómale una captura de pantalla y envíasela a Claude.</p></div>'});
const K="emp2",PN={hoy:"Hoy",semana:"7 días",mes:"Este mes",todo:"Todo"};
const cats=()=>S.neg?["Mercancía","Servicios","Transporte","Arriendo","Otros"]:["Comida","Transporte","Servicios","Arriendo","Salud","Ocio","Otros"];
const vacio=()=>({neg:true,nombre:"",caja0:0,mov:[],prod:[],cli:[],prov:[],deu:[],ven:[]});
let S=vacio(),tab="inicio",pe="mes",pt="cli",cat="inv",cart={},cliSel="",FOTO="";
try{const r=localStorage.getItem(K);if(r)S=Object.assign(vacio(),JSON.parse(r))}catch(e){}
let tt;function toast(m){const t=g("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("No se pudo guardar (poco espacio)")}};
const g=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const $=n=>(n<0?"-":"")+"$"+Math.round(Math.abs(n)).toLocaleString("es-CO");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>parseInt(String(v).replace(/\D/g,""),10)||0;
const iso=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const inP=f=>pe==="todo"||(pe==="hoy"?f===iso():pe==="semana"?f>=ago(6):f.slice(0,7)===iso().slice(0,7));
const mesOk=x=>x.f.slice(0,7)===iso().slice(0,7);
const fdate=f=>{const a=f.split("-");return a[2]+"/"+a[1]};
const sum=(a,fn)=>a.reduce((x,y)=>x+fn(y),0);
const fmt=el=>el.addEventListener("input",()=>{const d=el.value.replace(/\D/g,"");el.value=d?Number(d).toLocaleString("es-CO"):""});
const close=()=>g("ov").classList.remove("show");
g("ov").onclick=e=>{if(e.target===g("ov"))close()};
const mov=(t,m,c,x)=>S.mov.push(Object.assign({id:uid(),t,m,c,f:iso()},x));

function calc(ok){
  const M=S.mov.filter(ok),V=S.ven.filter(ok),G=M.filter(x=>x.t==="gas");
  const ing=sum(M.filter(x=>x.t!=="gas"),x=>x.m),egr=sum(G,x=>x.m);
  const vt=sum(V,v=>v.tot),cv=sum(V,v=>sum(v.it,i=>i.c*i.q)),go=sum(G.filter(x=>!["Mercancía","Préstamo","Pago de deudas"].includes(x.c)),x=>x.m);
  return{M,V,G,ing,egr,vt,cv,go,gan:vt-cv-go};
}
const saldo=()=>{const a=calc(()=>true);return S.caja0+a.ing-a.egr};
const deb=k=>sum(S.deu.filter(d=>d.k===k),d=>d.m);
const top=V=>{const m={};V.forEach(v=>v.it.forEach(i=>m[i.n]=(m[i.n]||0)+i.q));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5)};
const porCat=G=>{const m={};G.forEach(x=>m[x.c]=(m[x.c]||0)+x.m);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bars=(a,f)=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div style="margin:9px 0"><div class="row"><span>${esc(x[0])}</span><b>${f(x[1])}</b></div><div class="b2"><i style="width:${x[1]/mx*100}%"></i></div></div>`).join("")||'<div class="empty">Sin datos todavía</div>'};

function foto(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(file)}

function sheet(title,F,ok){
  FOTO="";
  g("sh").innerHTML=`<h2>${title}</h2>`+F.map(f=>`<label>${f.l}</label>`+(f.t==="s"
    ?`<select id="${f.id}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==f.v?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`
    :f.t==="f"?`<input type="file" id="${f.id}" accept="image/*">`
    :`<input id="${f.id}" ${f.t==="n"?'inputmode="numeric"':""} placeholder="${f.p||(f.t==="n"?"0":"")}" value="${f.v!=null?esc(f.t==="n"?Number(f.v).toLocaleString("es-CO"):f.v):""}" autocomplete="off">`)).join("")
    +`<div class="err" id="err"></div><button class="btn" id="okb">Guardar</button><button class="btn ghost" id="cn">Cancelar</button>`;
  F.forEach(f=>{if(f.t==="n")fmt(g(f.id));if(f.t==="f")g(f.id).onchange=e=>{if(e.target.files[0])foto(e.target.files[0],d=>{FOTO=d;toast("Foto lista ✓")})}});
  g("ov").classList.add("show");
  g("cn").onclick=close;
  const go=()=>{const v={};F.forEach(f=>v[f.id]=f.t==="f"?(FOTO||f.v||""):g(f.id).value.trim());const e=ok(v);if(e)g("err").textContent=e;else{save();close();render()}};
  g("okb").onclick=go;
  g("sh").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")go()};
}
const cliOpts=()=>[["","Contado"]].concat(S.cli.map(c=>[c.id,"Fiado a: "+c.n]));
function vender(it,cid){
  const c=S.cli.find(x=>x.id===cid),tot=sum(it,i=>i.pr*i.q),v={id:uid(),f:iso(),it,tot,cli:c?c.n:"",pago:c?"Fiado":"Contado"};
  it.forEach(i=>{const p=S.prod.find(x=>x.id===i.id);if(p)p.s-=i.q});
  S.ven.push(v);
  if(c)S.deu.push({id:uid(),k:"cli",n:c.n,m:tot,t:tot,f:v.f,vid:v.id});
  else mov("ven",tot,"Venta",{d:it.map(i=>i.n).join(", "),vid:v.id,lock:1});
  return v;
}
function compartir(t){try{if(navigator.share)navigator.share({text:t});else navigator.clipboard.writeText(t).then(()=>toast("Copiado ✓"))}catch(e){}}
function compr(v){
  const T=`🧾 ${S.nombre}\nComprobante de venta\nFecha: ${fdate(v.f)}\n`+(v.cli?`Cliente: ${v.cli}\n`:"")+v.it.map(i=>`${i.q} x ${i.n}  ${$(i.pr*i.q)}`).join("\n")+`\nTOTAL: ${$(v.tot)}\nPago: ${v.pago}`;
  g("sh").innerHTML=`<h2>Comprobante</h2><pre style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font-family:inherit;font-size:15px">${esc(T)}</pre><button class="btn" id="shr">Compartir</button><button class="btn ghost" id="cn">Cerrar</button>`;
  g("ov").classList.add("show");g("cn").onclick=close;g("shr").onclick=()=>compartir(T);
}
const persona=k=>sheet(k==="cli"?"Nuevo cliente":"Nuevo proveedor",[{id:"n",l:"Nombre"},{id:"t",l:"Teléfono (opcional)"}],v=>{if(!v.n)return"Escribe el nombre.";S[k].push({id:uid(),n:v.n,t:v.t});toast("Guardado ✓")});

const acts={
  ing:()=>sheet("Registrar ingreso",[{id:"m",l:"Monto",t:"n"},{id:"d",l:"Concepto (opcional)",p:S.neg?"Ej: Aporte propio":"Ej: Sueldo"}],v=>{
    const m=num(v.m);if(m<=0)return"El monto debe ser mayor a cero.";mov("ing",m,"Ingreso",{d:v.d});toast("Ingreso registrado ✓")}),
  gas:()=>sheet("Registrar gasto",[{id:"k",l:"Categoría",t:"s",o:cats().map(c=>[c,c])},{id:"d",l:"Concepto (opcional)",p:"Ej: Bus"},{id:"m",l:"Monto",t:"n"}],v=>{
    const m=num(v.m);if(m<=0)return"El monto debe ser mayor a cero.";mov("gas",m,v.k,{d:v.d});toast("Gasto registrado ✓")}),
  compra:()=>{
    if(!S.prod.length)return toast("Primero crea un producto");
    sheet("Comprar mercancía",[{id:"p",l:"Producto",t:"s",o:S.prod.map(p=>[p.id,p.n])},{id:"q",l:"Cantidad",t:"n"},{id:"m",l:"Costo total",t:"n"},{id:"v",l:"¿Cómo pagaste?",t:"s",o:[["","De contado"]].concat(S.prov.map(p=>[p.id,"A crédito: "+p.n]))}],v=>{
      const p=S.prod.find(x=>x.id===v.p),q=num(v.q),m=num(v.m);if(q<=0||m<=0)return"Escribe cantidad y costo.";
      p.s+=q;p.c=m/q;
      if(v.v)S.deu.push({id:uid(),k:"prov",n:S.prov.find(x=>x.id===v.v).n,m,t:m,f:iso(),mer:1});
      else mov("gas",m,"Mercancía",{d:p.n+" x"+q,lock:1});
      toast("Mercancía registrada ✓")})},
  prod:id=>{
    const p=S.prod.find(x=>x.id===id)||{};
    sheet(id?"Editar producto":"Nuevo producto",[{id:"n",l:"Nombre",v:p.n},{id:"p",l:"Precio de venta",t:"n",v:p.p},{id:"c",l:"Costo",t:"n",v:p.c?Math.round(p.c):undefined},{id:"s",l:"Cantidad en inventario",t:"n",v:p.s},{id:"d",l:"Descripción (para el catálogo)",v:p.d},{id:"f",l:"Foto (opcional)",t:"f",v:p.f}],v=>{
      if(!v.n)return"Escribe el nombre.";const o={n:v.n,p:num(v.p),c:num(v.c),s:num(v.s),d:v.d,f:v.f};
      if(o.p<=0)return"El precio debe ser mayor a cero.";
      if(id)Object.assign(p,o);else S.prod.push(Object.assign({id:uid()},o));toast("Producto guardado ✓")})},
  vrapida:()=>sheet("Venta rápida",[{id:"n",l:"¿Qué vendiste?",p:"Ej: Gaseosas"},{id:"m",l:"Valor",t:"n"},{id:"c",l:"Cliente",t:"s",o:cliOpts()}],v=>{
    const m=num(v.m);if(m<=0)return"El valor debe ser mayor a cero.";
    const r=vender([{id:"",n:v.n||"Venta",q:1,pr:m,c:0}],v.c);setTimeout(()=>compr(r),60)}),
  cli:()=>persona("cli"),prov:()=>persona("prov"),
  abono:id=>{
    const d=S.deu.find(x=>x.id===id);
    sheet((d.k==="cli"?"Cobrar a ":"Pagar a ")+d.n,[{id:"m",l:"Monto (debe "+$(d.m)+")",t:"n"}],v=>{
      const m=num(v.m);if(m<=0||m>d.m)return"El monto debe ser mayor a cero y no superar "+$(d.m)+".";
      d.m-=m;if(d.k==="cli")mov("abo",m,"Abono",{d:d.n,lock:1});else mov("gas",m,d.mer?"Mercancía":"Pago de deudas",{d:"Pago a "+d.n,lock:1});
      toast(d.m?"Registrado ✓":"¡Deuda saldada! 🎉")})},
  deuda:()=>sheet("Nueva deuda",[{id:"k",l:"Tipo",t:"s",o:[["cli","Alguien me debe"],["prov","Yo debo"]]},{id:"n",l:"Nombre de la persona",p:"Ej: Juan"},{id:"m",l:"Monto",t:"n"},{id:"a",l:"¿Afecta tu dinero actual?",t:"s",o:[["0","No, solo anotarla"],["1","Sí: presté o me prestaron el dinero"]]}],v=>{
    const m=num(v.m);if(!v.n)return"Escribe el nombre.";if(m<=0)return"El monto debe ser mayor a cero.";
    S.deu.push({id:uid(),k:v.k,n:v.n,m,t:m,f:iso()});
    if(v.a==="1"){if(v.k==="cli")mov("gas",m,"Préstamo",{d:"Préstamo a "+v.n,lock:1});else mov("ing",m,"Préstamo",{d:"Préstamo de "+v.n,lock:1})}
    toast("Deuda registrada ✓")}),
  modo:()=>sheet("Tipo de uso",[{id:"m",l:"¿Para qué usas la app?",t:"s",v:S.neg?"1":"0",o:[["1","Mi negocio o emprendimiento"],["0","Mis finanzas personales"]]}],v=>{S.neg=v.m==="1";tab="inicio";toast("Listo ✓")}),
  caja0:()=>sheet("Dinero inicial",[{id:"m",l:"Dinero con el que empezaste",t:"n",v:S.caja0}],v=>{S.caja0=num(v.m);toast("Actualizado ✓")})
};
const DEL={mov:i=>S.mov=S.mov.filter(x=>x.id!==i),prod:i=>S.prod=S.prod.filter(x=>x.id!==i),cli:i=>S.cli=S.cli.filter(x=>x.id!==i),prov:i=>S.prov=S.prov.filter(x=>x.id!==i),deu:i=>S.deu=S.deu.filter(x=>x.id!==i)};
const H={
  t:a=>{tab=a;scrollTo(0,0)},pe:a=>{pe=a},pt:a=>{pt=a},cat:a=>{cat=a},
  a:a=>acts[a](),ed:a=>acts.prod(a),ab:a=>acts.abono(a),
  c:a=>{const s=a.split(":"),p=S.prod.find(x=>x.id===s[0]);cart[s[0]]=Math.max(0,Math.min(p.s,(cart[s[0]]||0)+ +s[1]))},
  ver:a=>compr(S.ven.find(x=>x.id===a)),
  an:id=>{if(!confirm("¿Anular esta venta? Se devuelve el inventario."))return;const v=S.ven.find(x=>x.id===id);v.it.forEach(i=>{const p=S.prod.find(x=>x.id===i.id);if(p)p.s+=i.q});S.ven=S.ven.filter(x=>x!==v);S.mov=S.mov.filter(x=>x.vid!==id);S.deu=S.deu.filter(x=>x.vid!==id);toast("Venta anulada")},
  del:a=>{const s=a.split(":");if(confirm("¿Eliminar este registro?")){DEL[s[0]](s[1]);toast("Eliminado")}}
};
const trash=(k,i)=>`<button class="x" data-h="del|${k}:${i}" aria-label="Eliminar">🗑</button>`;
const lista=(a,fn,t)=>a.length?a.map(fn).reverse().join(""):`<div class="empty">${t}</div>`;
const chips=(arr,cur,key)=>`<div class="chips">${arr.map(c=>`<button class="chip${cur===c[0]?" on":""}" data-h="${key}|${c[0]}">${c[1]}</button>`).join("")}</div>`;
const movRow=x=>`<div class="item"><div>${x.t==="gas"?"💸":x.t==="ven"?"💰":"⬆️"} ${esc(x.d||x.c)}<div class="mut">${fdate(x.f)} · ${esc(x.c)}</div></div><div class="end"><b class="${x.t==="gas"?"bad":"ok"}">${x.t==="gas"?"-":"+"}${$(x.m)}</b>${x.lock?"":trash("mov",x.id)}</div></div>`;

function setup(){
  g("app").innerHTML=`<h1>👋 Bienvenido</h1><p class="sub">Configura la app para empezar.</p><div class="card"><label>¿Para qué la vas a usar?</label><select id="sm"><option value="1">Mi negocio o emprendimiento</option><option value="0">Mis finanzas personales</option></select><label>Tu nombre o el de tu negocio</label><input id="sn" placeholder="Ej: Cristian"><label>Dinero con el que empiezas</label><input id="si" inputmode="numeric" placeholder="0"><div class="err" id="se"></div><button class="btn" id="sb">Empezar</button><button class="btn line" id="im0">Restaurar copia de seguridad</button></div>`;
  fmt(g("si"));
  g("sb").onclick=()=>{const n=g("sn").value.trim();if(!n)return g("se").textContent="Escribe el nombre.";S.nombre=n;S.neg=g("sm").value==="1";S.caja0=num(g("si").value);save();render()};
  g("im0").onclick=()=>g("fi").click();
}

function view(){
  if(tab==="inicio"){
    const m=calc(mesOk),low=S.prod.filter(p=>p.s<=3);
    if(!S.neg)return `<h1>${esc(S.nombre)}</h1><p class="sub">Tu dinero de un vistazo</p>
    <div class="card hero"><div class="lbl">Dinero disponible</div><div class="big">${$(saldo())}</div><div class="row" style="margin-top:12px"><div><div class="lbl">Gastado este mes</div><b>${$(m.egr)}</b></div><div style="text-align:right"><div class="lbl">Ingresado este mes</div><b>${$(m.ing)}</b></div></div></div>
    <div class="grid"><button class="act" data-h="a|ing"><span>⬆️</span>Ingreso</button><button class="act" data-h="a|gas"><span>💸</span>Gasto</button><button class="act" data-h="a|deuda"><span>📒</span>Nueva deuda</button><button class="act" data-h="t|rep"><span>📊</span>Resumen</button></div>
    <div class="card"><h3>Deudas</h3><div class="row"><span>Me deben</span><b class="ok">${$(deb("cli"))}</b></div><div class="row" style="margin-top:6px"><span>Yo debo</span><b class="bad">${$(deb("prov"))}</b></div></div>
    <div class="card"><h3>Últimos movimientos</h3>${lista(S.mov.slice(-6),movRow,"Aún no hay movimientos")}</div>`;
    return `<h1>${esc(S.nombre)}</h1><p class="sub">Resumen de tu negocio</p>
    <div class="card hero"><div class="lbl">Saldo de caja</div><div class="big">${$(saldo())}</div><div class="row" style="margin-top:12px"><div><div class="lbl">Ganancia del mes</div><b>${$(m.gan)}</b></div><div style="text-align:right"><div class="lbl">Por cobrar</div><b>${$(deb("cli"))}</b></div></div></div>
    ${low.length?`<div class="card"><h3>⚠️ Pocas unidades</h3>${low.map(p=>`<div class="mut">${esc(p.n)}: ${p.s}</div>`).join("")}</div>`:""}
    <div class="grid"><button class="act" data-h="t|vender"><span>💰</span>Vender</button><button class="act" data-h="a|ing"><span>⬆️</span>Ingreso</button><button class="act" data-h="a|gas"><span>💸</span>Gasto</button><button class="act" data-h="a|compra"><span>📦</span>Comprar mercancía</button></div>
    <div class="card"><h3>Últimos movimientos</h3>${lista(S.mov.slice(-6),movRow,"Aún no hay movimientos")}</div>`;
  }
  if(tab==="mov"){const r=calc(x=>inP(x.f));return `<h1>Movimientos</h1>${chips(Object.keys(PN).map(k=>[k,PN[k]]),pe,"pe")}<div class="card"><div class="row"><span>Ingresos <b class="ok">${$(r.ing)}</b></span><span>Gastos <b class="bad">${$(r.egr)}</b></span></div></div><div class="card">${lista(r.M,movRow,"No hay movimientos en este período")}</div>`}
  if(tab==="vender"){
    const P=S.prod.filter(p=>p.s>0),t=sum(P,p=>(cart[p.id]||0)*p.p);
    return `<h1>Vender</h1><p class="sub">Elige los productos y cobra</p><div class="card">`+(P.length?P.map(p=>`<div class="item"><div>${esc(p.n)}<div class="mut">${$(p.p)} · quedan ${p.s}</div></div><div class="end"><button class="sm" data-h="c|${p.id}:-1">−</button><b>${cart[p.id]||0}</b><button class="sm" data-h="c|${p.id}:1">+</button></div></div>`).join(""):`<div class="empty">No hay productos con inventario. Crea uno en Productos o usa la venta rápida.</div>`)+`</div>
    <div class="card"><label>Cliente</label><select id="cs" onchange="cliSel=this.value">${cliOpts().map(o=>`<option value="${o[0]}"${o[0]===cliSel?" selected":""}>${esc(o[1])}</option>`).join("")}</select><div class="row"><b>Total</b><span class="big">${$(t)}</span></div></div>
    <button class="btn" id="cobrar">Cobrar</button><button class="btn line" data-h="a|vrapida">Venta rápida (sin inventario)</button>
    <div class="card"><h3>Últimas ventas</h3>${lista(S.ven.slice(-5),v=>`<div class="item"><div>${esc(v.it.map(i=>i.n).join(", "))}<div class="mut">${fdate(v.f)} · ${v.pago}${v.cli?" · "+esc(v.cli):""}</div></div><div class="end"><b>${$(v.tot)}</b><button class="x" data-h="ver|${v.id}">🧾</button><button class="x" data-h="an|${v.id}">🗑</button></div></div>`,"Aún no hay ventas")}</div>`;
  }
  if(tab==="prod"){
    const c=chips([["inv","Inventario"],["cat","Catálogo"]],cat,"cat");
    if(cat==="cat")return `<h1>Catálogo</h1>${c}`+(S.prod.length?`<div class="cg">${S.prod.map(p=>`<div class="pc">${p.f?`<img src="${p.f}" alt="">`:`<div class="ph">📦</div>`}<div class="t"><b>${esc(p.n)}</b><div class="ok">${$(p.p)}</div><div class="mut">${esc(p.d||"")}</div></div></div>`).join("")}</div><button class="btn" id="shc">Compartir catálogo</button>`:`<div class="card"><div class="empty">Crea productos para armar tu catálogo</div></div>`);
    return `<h1>Productos</h1><p class="sub">Valor del inventario: <b>${$(sum(S.prod,p=>p.c*p.s))}</b></p>${c}<div class="card">${lista(S.prod,p=>`<div class="item"><div>${esc(p.n)}<div class="mut">Venta ${$(p.p)} · Costo ${$(p.c)}</div></div><div class="end"><b class="${p.s<=3?"bad":""}">${p.s} u.</b><button class="x" data-h="ed|${p.id}">✏️</button>${trash("prod",p.id)}</div></div>`,"Aún no hay productos")}</div>
    <button class="btn" data-h="a|prod">＋ Nuevo producto</button><button class="btn line" data-h="a|compra">📦 Comprar mercancía</button>`;
  }
  if(tab==="pers"){
    const c=S.neg?chips([["cli","Clientes"],["prov","Proveedores"],["deu","Deudas"]],pt,"pt"):"";
    if(!S.neg||pt==="deu"){
      const row=d=>`<div class="item"><div>${esc(d.n)}<div class="mut">Original ${$(d.t)} · ${fdate(d.f)}</div></div><div class="end"><b class="${d.k==="cli"?"ok":"bad"}">${$(d.m)}</b>${d.m>0?`<button class="sm" data-h="ab|${d.id}">${d.k==="cli"?"Cobrar":"Pagar"}</button>`:"✓"}${trash("deu",d.id)}</div></div>`;
      return `<h1>${S.neg?"Personas":"Deudas"}</h1>${c}<div class="card"><h3>${S.neg?"Por cobrar":"Me deben"}: <span class="ok">${$(deb("cli"))}</span></h3>${lista(S.deu.filter(d=>d.k==="cli"),row,"Nadie te debe")}</div><div class="card"><h3>${S.neg?"Por pagar":"Yo debo"}: <span class="bad">${$(deb("prov"))}</span></h3>${lista(S.deu.filter(d=>d.k==="prov"),row,"No debes nada")}</div><button class="btn" data-h="a|deuda">＋ Nueva deuda</button>`;
    }
    return `<h1>Personas</h1>${c}<div class="card">${lista(S[pt],p=>`<div class="item"><div>${esc(p.n)}<div class="mut">${esc(p.t||"Sin teléfono")}</div></div>${trash(pt,p.id)}</div>`,pt==="cli"?"Aún no hay clientes":"Aún no hay proveedores")}</div><button class="btn" data-h="a|${pt}">＋ ${pt==="cli"?"Nuevo cliente":"Nuevo proveedor"}</button>`;
  }
  const r=calc(x=>inP(x.f));
  return `<h1>${S.neg?"Reportes":"Resumen"}</h1>${chips(Object.keys(PN).map(k=>[k,PN[k]]),pe,"pe")}
  <div class="card"><h3>Balance</h3>
  <div class="item"><span>Ingresos</span><b class="ok">${$(r.ing)}</b></div>
  <div class="item"><span>Egresos</span><b class="bad">${$(r.egr)}</b></div>
  <div class="item"><span>${S.neg?"Saldo de caja (total)":"Dinero disponible"}</span><b>${$(saldo())}</b></div></div>
  ${S.neg?`<div class="card"><h3>Ganancia</h3>
  <div class="item"><span>Ventas</span><b>${$(r.vt)}</b></div>
  <div class="item"><span>Costo de lo vendido</span><b>-${$(r.cv)}</b></div>
  <div class="item"><span>Gastos del negocio</span><b>-${$(r.go)}</b></div>
  <div class="item"><span>Ganancia real</span><b class="${r.gan>=0?"ok":"bad"}">${$(r.gan)}</b></div>
  <div class="mut">El saldo de caja no es lo mismo que la ganancia: la caja incluye tu inversión y no cuenta lo que te deben.</div></div>
  <div class="card"><h3>Productos más vendidos</h3>${bars(top(r.V),v=>v+" u.")}</div>`:""}
  <div class="card"><h3>Gastos por categoría</h3>${bars(porCat(r.G),$)}</div>
  <button class="btn" id="sd">📤 Compartir reporte</button>
  <button class="btn line" data-h="a|caja0">Cambiar dinero inicial</button>
  <button class="btn line" data-h="a|modo">Cambiar tipo de uso</button>
  <button class="btn line" id="ex">💾 Descargar copia de seguridad</button>
  <button class="btn line" id="im">📂 Restaurar copia de seguridad</button>
  <button class="btn danger" id="rs">Borrar todo y empezar de nuevo</button>`;
}

function exportar(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="copia-"+S.nombre.replace(/\W+/g,"-")+".json";a.click();toast("Copia descargada ✓")}
function importar(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(typeof d.nombre!=="string"||!Array.isArray(d.mov))throw 0;S=Object.assign(vacio(),d);save();render();toast("Datos restaurados ✓")}catch(e){toast("Archivo no válido")}};r.readAsText(f)}
g("fi").onchange=e=>{if(e.target.files[0])importar(e.target.files[0]);e.target.value=""};
const on=(id,f)=>{const e=g(id);if(e)e.onclick=f};

function render(){
  if(!S.nombre)return setup();
  if(!S.neg&&(tab==="vender"||tab==="prod"))tab="inicio";
  const T=S.neg?[["inicio","🏠","Inicio"],["vender","💰","Vender"],["prod","📦","Productos"],["pers","👥","Personas"],["rep","📊","Reportes"]]:[["inicio","🏠","Inicio"],["mov","💳","Movimientos"],["pers","🤝","Deudas"],["rep","📊","Resumen"]];
  g("app").innerHTML=view()+`<nav><div>${T.map(t=>`<button data-h="t|${t[0]}" class="${tab===t[0]?"on":""}"><b>${t[1]}</b>${t[2]}</button>`).join("")}</div></nav>`;
  g("app").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const p=b.dataset.h,j=p.indexOf("|");H[p.slice(0,j)](p.slice(j+1));save();render()});
  on("cobrar",()=>{
    const it=S.prod.filter(p=>cart[p.id]>0).map(p=>({id:p.id,n:p.n,q:cart[p.id],pr:p.p,c:p.c}));
    if(!it.length)return toast("Agrega productos a la venta");
    const v=vender(it,cliSel);cart={};cliSel="";save();render();compr(v)});
  on("shc",()=>compartir("🛍️ Catálogo de "+S.nombre+"\n\n"+S.prod.map(p=>"• "+p.n+" — "+$(p.p)+(p.d?"\n  "+p.d:"")).join("\n")));
  on("sd",()=>{const r=calc(x=>inP(x.f));compartir(!S.neg?`📊 ${S.nombre} — ${PN[pe]}\nIngresos: ${$(r.ing)}\nGastos: ${$(r.egr)}\nDinero disponible: ${$(saldo())}\nMe deben: ${$(deb("cli"))}\nYo debo: ${$(deb("prov"))}`:`📊 ${S.nombre} — ${PN[pe]}\nVentas: ${$(r.vt)}\nCosto de lo vendido: ${$(r.cv)}\nGastos: ${$(r.go)}\nGanancia: ${$(r.gan)}\nSaldo de caja: ${$(saldo())}\nPor cobrar: ${$(deb("cli"))}`)});
  on("ex",exportar);on("im",()=>g("fi").click());
  on("rs",()=>{if(confirm("¿Seguro? Se borrarán todos tus datos. Descarga una copia antes si quieres conservarlos.")){S=vacio();save();tab="inicio";render()}});
}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
